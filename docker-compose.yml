services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: wavelane-backend

    ports:
      - "4000:4000"

    environment:
      PORT: 4000
      JWT_SECRET: change-this-in-production
      ADMIN_EMAIL: admin@wavelane.app
      ADMIN_PASSWORD: admin1234
      DATABASE_URL: file:/app/data/dev.db

    volumes:
      - wavelane-data:/app/data
      - ./backend/uploads:/app/uploads

    networks:
      - wavelane-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: wavelane-frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - wavelane-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile

    container_name: wavelane-admin

    ports:
      - "3001:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - wavelane-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


volumes:
  wavelane-data:


networks:
  wavelane-network:
    driver: bridge