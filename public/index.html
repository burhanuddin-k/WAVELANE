<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaveLane - Stream Music</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo"><b>W</b> WaveLane</a>
    <a href="/admin/index.html" class="admin-link">Admin Studio ↗</a>
  </header>

  <main>
    <section class="hero">
      <h1>Discover New Soundtracks</h1>
      <p>Stream uploaded tracks live from your local studio library.</p>
    </section>

    <section class="catalog-section">
      <h2>Recent Tracks</h2>
      <div id="player-grid" class="grid"></div>
    </section>
  </main>

  <footer id="audio-bar">
    <div class="now-playing">
      <img id="current-cover" src="/assets/default-cover.svg" alt="Cover">
      <div>
        <b id="current-title">Select a track</b>
        <small id="current-artist">WaveLane Studio</small>
      </div>
    </div>
    <audio id="audio-player" controls></audio>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
